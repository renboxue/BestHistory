name: Replace Discord invite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-discord-invite.yml'

permissions:
  contents: write

jobs:
  replace-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old Discord invite with permanent invite
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://discord.gg/X6p6BxdDW'
          NEW='https://discord.gg/QRHNKweYqS'

          mapfile -d '' FILES < <(grep -rlZ --exclude-dir=.git --exclude='replace-discord-invite.yml' "$OLD" . || true)

          if (( ${#FILES[@]} == 0 )); then
            echo 'No old invite links found.'
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            sed -i "s#${OLD}#${NEW}#g" "$FILE"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Discord invite with permanent link'
          git push
