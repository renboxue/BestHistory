    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }

    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:28px; box-shadow:0 8px 30px rgba(16,24,40,.06); display:flex; flex-direction:column; min-height:360px; }
    .card.featured { border:2px solid var(--accent); position:relative; }
    .badge { position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
    .plan { font-size:20px; font-weight:800; margin-bottom:12px; }
    .price { font-size:42px; font-weight:850; letter-spacing:-.04em; }
    .period { color:var(--muted); font-size:14px; margin-top:4px; }
    .saving { color:var(--ok); font-size:13px; font-weight:700; margin-top:8px; min-height:20px; }
    ul { padding-left:20px; color:var(--muted); line-height:1.8; flex:1; }
    button { border:0; border-radius:12px; padding:13px 16px; font:inherit; font-weight:750; cursor:pointer; background:#111827; color:#fff; width:100%; }
    .featured button { background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    button:disabled { opacity:.55; cursor:wait; }
    #status { margin-top:24px; text-align:center; min-height:24px; color:var(--muted); font-size:14px; }
    .foot { text-align:center; margin-top:34px; color:var(--muted); font-size:13px; line-height:1.6; }
    [dir="rtl"] ul { padding-left:0; padding-right:20px; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } .card { min-height:0; } }

function normalizeLocale(v){v=(v||'').toLowerCase();if(v.startsWith('zh-tw')||v.startsWith('zh-hk'))return'zh-TW';if(v.startsWith('zh'))return'zh-CN';for(const k of ['ja','ko','es','pt','fr','de','it','nl','ru','ar','hi','id','tr','bn','vi'])if(v.startsWith(k))return k;return'en';}
const select=document.getElementById('language');
const params=new URLSearchParams(location.search);let locale=params.get('lang');locale=T[locale]?locale:normalizeLocale(navigator.language);select.value=locale;
function applyLocale(loc){locale=loc;const tr=T[loc]||T.en;document.documentElement.lang=loc;document.documentElement.dir=loc==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(tr[k])el.textContent=tr[k];});document.title='BestHistory Pro — '+(loc==='zh-CN'?'Paddle Sandbox 测试':loc==='zh-TW'?'Paddle Sandbox 測試':'Paddle Sandbox Test');history.replaceState(null,'',location.pathname+'?lang='+encodeURIComponent(loc));}
select.addEventListener('change',()=>applyLocale(select.value));applyLocale(locale);
const statusEl=document.getElementById('status');const buttons=Array.from(document.querySelectorAll('[data-price]'));function setBusy(b){buttons.forEach(x=>x.disabled=b);}function tx(k){return(T[locale]||T.en)[k]||T.en[k];}
try{Paddle.Environment.set('sandbox');Paddle.Initialize({token:'test_b87d133e3906a5974c5a3d9c5bc',eventCallback:function(event){if(event&&event.name==='checkout.completed')statusEl.textContent=tx('completed');if(event&&(event.name==='checkout.closed'||event.name==='checkout.error'))setBusy(false);}});buttons.forEach(button=>button.addEventListener('click',()=>{statusEl.textContent=tx('opening');setBusy(true);try{Paddle.Checkout.open({items:[{priceId:button.dataset.price,quantity:1}],settings:{displayMode:'overlay',variant:'one-page',theme:'light'}});setTimeout(()=>setBusy(false),1200);}catch(e){console.error(e);statusEl.textContent=tx('failed');setBusy(false);}}));}catch(e){console.error(e);statusEl.textContent=tx('initFailed');setBusy(false);}
