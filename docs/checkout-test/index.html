<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BestHistory Payment Stage B</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6fa;color:#1d2940;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{width:min(560px,100%);background:#fff;border:1px solid #e1e5ef;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(25,35,70,.08)}
    h1{margin:0 0 10px;font-size:24px}
    p{color:#6f7890;line-height:1.7}
    button{border:0;border-radius:12px;background:#626bea;color:#fff;font-size:16px;font-weight:700;padding:13px 18px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .ok{color:#16825d;font-weight:700}
    .err{color:#c23b3b;font-weight:700}
    pre{margin-top:18px;padding:14px;border-radius:12px;background:#f6f7fb;border:1px solid #e7e9f1;white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,Menlo,monospace;max-height:300px;overflow:auto}
    small{display:block;margin-top:18px;color:#939bad;line-height:1.6}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>BestHistory Payment Stage B</h1>
    <p>仅验证：当前 HTTPS Host 能否正常加载 Paddle.js，并用 BestHistory 年付 Sandbox Price 打开 Paddle Checkout。</p>
    <p id="status">正在初始化 Paddle.js…</p>
    <button id="open" disabled>打开 Paddle Sandbox Checkout</button>
    <pre id="log"></pre>
    <small>测试卡：4242 4242 4242 4242 · CVV 100 · 任意未来有效期。本页不连接 BestHistory 用户、订单或权益系统。</small>
  </section>
</main>
<script>
const CLIENT_TOKEN='test_b87d133e3906a5974c5a3d9c5bc';
const ANNUAL_PRICE_ID='pri_01m0y8v82sxexbwyety9276pzr';
const statusEl=document.getElementById('status');
const button=document.getElementById('open');
const logEl=document.getElementById('log');
function log(step,data){
  logEl.textContent+='['+new Date().toISOString()+'] '+step+'\n'+(data?JSON.stringify(data,null,2):'')+'\n\n';
  logEl.scrollTop=logEl.scrollHeight;
}
function setStatus(text,cls=''){
  statusEl.textContent=text;
  statusEl.className=cls;
}
try{
  if(!window.Paddle) throw new Error('PADDLE_JS_NOT_LOADED');
  Paddle.Environment.set('sandbox');
  Paddle.Initialize({
    token:CLIENT_TOKEN,
    eventCallback(event){
      log('paddle-event',{
        name:event?.name||null,
        transactionId:event?.data?.transaction_id||event?.data?.id||null,
        status:event?.data?.status||null
      });
      if(event?.name==='checkout.completed'){
        setStatus('STAGE B：Paddle Checkout 已完成 Sandbox 支付。','ok');
      }
    }
  });
  setStatus('Paddle.js 初始化成功。现在点击按钮。','ok');
  log('init',{host:location.host,priceId:ANNUAL_PRICE_ID});
  button.disabled=false;
}catch(error){
  setStatus('Paddle.js 初始化失败：'+String(error),'err');
  log('init-error',{error:String(error)});
}
button.addEventListener('click',()=>{
  try{
    setStatus('正在打开 Paddle Checkout…');
    log('checkout-open',{priceId:ANNUAL_PRICE_ID});
    Paddle.Checkout.open({
      items:[{priceId:ANNUAL_PRICE_ID,quantity:1}],
      settings:{displayMode:'overlay',variant:'one-page',theme:'light'}
    });
  }catch(error){
    setStatus('Paddle Checkout 打开失败：'+String(error),'err');
    log('checkout-open-error',{error:String(error)});
  }
});
</script>
</body>
</html>
