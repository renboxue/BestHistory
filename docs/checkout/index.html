tory Pro активен.","pending":"Оплата завершена, но серверная активация еще синхронизируется. Обновите статус в BestHistory чуть позже.","failed":"Не удалось открыть checkout. Повторите из BestHistory.","initFailed":"Не удалось инициализировать Paddle.js. Перезагрузите страницу.","testCard":"Sandbox-карта: 4242 4242 4242 4242 · CVV 100 · любая будущая дата.","secure":"Pro выдается только после проверки Paddle сервером BestHistory; эта страница сама Pro не включает.","returning":"Возвращаемся в BestHistory…","returnFailed":"Автоматический возврат не удался. Используйте кнопку ниже."},"ar":{"title":"BestHistory Pro","opening":"جارٍ فتح Paddle Sandbox Checkout…","paid":"اكتمل الدفع. جارٍ تفعيل BestHistory Pro…","activated":"تم التحقق من الدفع. BestHistory Pro مفعّل.","pending":"اكتمل الدفع لكن التفعيل على الخادم ما زال قيد المزامنة. حدّث العضوية في BestHistory بعد قليل.","failed":"تعذر فتح الدفع. حاول مرة أخرى من BestHistory.","initFailed":"تعذر تهيئة Paddle.js. أعد تحميل الصفحة.","testCard":"بطاقة Sandbox: 4242 4242 4242 4242 · CVV 100 · أي تاريخ انتهاء مستقبلي.","secure":"لا يتم منح Pro إلا بعد تحقق خادم BestHistory من Paddle؛ هذه الصفحة لا تمنح Pro مباشرة أبدًا.","returning":"جارٍ العودة إلى BestHistory…","returnFailed":"تعذرت العودة تلقائيًا. استخدم الزر أدناه."},"hi":{"title":"BestHistory Pro","opening":"Paddle Sandbox Checkout खुल रहा है…","paid":"भुगतान पूरा हुआ। BestHistory Pro सक्रिय हो रहा है…","activated":"भुगतान सत्यापित है। BestHistory Pro सक्रिय है।","pending":"भुगतान पूरा है, लेकिन सर्वर सक्रियण अभी सिंक हो रहा है। थोड़ी देर बाद BestHistory में सदस्यता रिफ्रेश करें।","failed":"Checkout नहीं खुला। BestHistory से फिर प्रयास करें।","initFailed":"Paddle.js प्रारंभ नहीं हुआ। पेज रीलोड करें।","testCard":"Sandbox कार्ड: 4242 4242 4242 4242 · CVV 100 · कोई भविष्य की expiry.","secure":"Pro केवल BestHistory सर्वर द्वारा Paddle सत्यापन के बाद मिलता है; यह पेज स्वयं Pro नहीं देता।","returning":"BestHistory पर वापस जा रहे हैं…","returnFailed":"स्वचालित रूप से वापस नही js চালু করা যায়নি। পেজ রিলোড করুন।","testCard":"Sandbox কার্ড: 4242 4242 4242 4242 · CVV 100 · ভবিষ্যতের যেকোনো মেয়াদ।","secure":"BestHistory সার্ভার Paddle যাচাই করার পরেই Pro দেওয়া হয়; এই পেজ নিজে কখনও Pro দেয় না।","returning":"BestHistory-এ ফিরে যাচ্ছে…","returnFailed":"স্বয়ংক্রিয়ভাবে ফেরা যায়নি। নিচের বোতামটি ব্যবহার করুন।"},"vi":{"title":"BestHistory Pro","opening":"Đang mở Paddle Sandbox Checkout…","paid":"Thanh toán hoàn tất. Đang kích hoạt BestHistory Pro…","activated":"Thanh toán đã được xác minh. BestHistory Pro đã hoạt động.","pending":"Thanh toán đã hoàn tất nhưng kích hoạt máy chủ vẫn đang đồng bộ. Hãy làm mới thành viên trong BestHistory sau ít phút.","failed":"Không thể mở checkout. Hãy thử lại từ BestHistory.","initFailed":"Không thể khởi tạo Paddle.js. Hãy tải lại trang.","testCard":"Thẻ Sandbox: 4242 4242 4242 4242 · CVV 100 · ngày hết hạn trong tương lai.","secure":"Pro chỉ được cấp sau khi máy chủ BestHistory xác minh Paddle; trang này không bao giờ tự cấp Pro.","returning":"Đang quay lại BestHistory…","returnFailed":"Không thể tự động quay lại. Hãy dùng nút bên dưới."}};
const API_BASE='https://fuepiplrpixvfxctqdpo.supabase.co/functions/v1';
const CLIENT_TOKEN='test_b87d133e3906a5974c5a3d9c5bc';
const QUERY=new URLSearchParams(location.search);
const PARAM_TXN=QUERY.get('_ptxn')||'';
const STORED_TXN=sessionStorage.getItem('besthistory_paddle_txn')||'';
const TXN=/^txn_[a-z\d]{26}$/.test(PARAM_TXN)?PARAM_TXN:(/^txn_[a-z\d]{26}$/.test(STORED_TXN)?STORED_TXN:'');
const EXT=/^[a-p]{32}$/.test(QUERY.get('ext_id')||'')?(QUERY.get('ext_id')||''):'';
let lang='en';
let activated=false;
let paymentCompleted=false;
let pollTimer=null;
const deadline=Date.now()+2*60*1000;

function detectLang(){
  const q=QUERY.get('lang');
  if(q&&T[q])return q;
  const b=(navigator.language||'en').toLowerCase();
  if(b.startsWith('zh-tw')||b.startsWith('zh-hk'))return'zh-TW';
  if(b.startsWith('zh'))return'zh-CN';
  if(b.startsWith('pt'))return'pt';
  return Object.keys(T).find(k=>b===k.toLowerCase()||b.startsWith(k.toLowerCase()+'-'))||'en';
}
function tr(k){return (T[lang]||T.en)[k]||T.en[k]||k}
function debug(step,data){
  const el=document.getElementById('debug');
  el.textContent+='['+new Date().toISOString()+'] '+step+'\n'+(data?JSON.stringify(data,null,2):'')+'\n\n';
  el.scrollTop=el.scrollHeight;
}
function setStatus(key){document.getElementById('status').textContent=tr(key)}
function render(){
  lang=detectLang();
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('title').textContent=tr('title');
  document.getElementById('testCard').textContent=tr('testCard');
  document.getElementById('secure').textContent=tr('secure');
  setStatus('opening');
}
async function post(name,body){
  const response=await fetch(API_BASE+'/'+name,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data=await response.json().catch(()=>null);
  debug(name,{http:response.status,data});
  if(!response.ok)throw new Error(data?.error||('HTTP_'+response.status));
  return data;
}
function notifyExtension(){
  if(!EXT||!window.chrome||!chrome.runtime||!chrome.runtime.sendMessage){
    setStatus('activated');
    return;
  }
  setStatus('returning');
  try{
    chrome.runtime.sendMessage(EXT,{type:'besthistory:payment-complete',transactionId:TXN},response=>{
      if(chrome.runtime.lastError){
        debug('return-error',chrome.runtime.lastError.message);
        setStatus('returnFailed');
        return;
      }
      debug('return-response',response||null);
      if(response?.ok){
        try{window.close()}catch{}
      }else{
        setStatus('returnFailed');
      }
    });
  }catch(error){
    debug('return-error',String(error));
    setStatus('returnFailed');
  }
}
async function poll(){
  clearTimeout(pollTimer);
  if(activated)return;
  try{
    const data=await post('billing-checkout-status',{transactionId:TXN});
    if(data.activated){
      activated=true;
      document.getElementById('spinner').style.display='none';
      setStatus('activated');
      setTimeout(notifyExtension,450);
      return;
    }
  }catch(error){
    debug('poll-error',String(error));
  }
  if(Date.now()<deadline){
    pollTimer=setTimeout(()=>void poll(),1800);
  }else if(paymentCompleted){
    setStatus('pending');
  }
}
function onPaddleEvent(event){
  debug('paddle-event',{
    name:event?.name,
    transactionId:event?.data?.transaction_id||event?.data?.id||null,
    status:event?.data?.status||null
  });
  if(event?.name==='checkout.completed'){
    paymentCompleted=true;
    setStatus('paid');
    void poll();
  }else if(event?.name==='checkout.closed'&&!paymentCompleted){
    setStatus('failed');
  }
}
async function init(){
  render();
  if(!TXN){
    document.getElementById('spinner').style.display='none';
    setStatus('failed');
    return;
  }
  sessionStorage.setItem('besthistory_paddle_txn',TXN);

  // Prevent Paddle.js from auto-opening the _ptxn payment link before we initialize
  // our explicit transactionId checkout and event callback.
  const clean=new URL(location.href);
  clean.searchParams.delete('_ptxn');
  history.replaceState(null,'',clean);

  debug('init',{transactionId:TXN,extensionId:EXT||null,lang});
  try{
    Paddle.Environment.set('sandbox');
    Paddle.Initialize({token:CLIENT_TOKEN,eventCallback:onPaddleEvent});
    Paddle.Checkout.open({
      transactionId:TXN,
      settings:{displayMode:'overlay',variant:'one-page',theme:'light'}
    });
    void poll();
  }catch(error){
    debug('init-error',String(error));
    document.getElementById('spinner').style.display='none';
    setStatus('initFailed');
  }
}
void init();
</script>
