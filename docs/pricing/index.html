const PLANS={"monthly":{"priceId":"","plan":"monthly"},"annual":{"priceId":"","plan":"annual"},"lifetime":{"priceId":"","plan":"lifetime"}};
const API_BASE='https://fuepiplrpixvfxctqdpo.supabase.co/functions/v1';
let PADDLE_CONFIG=null;let paddleReady=false;
const PARAMS=new URLSearchParams(location.search);const CHECKOUT_REF=PARAMS.get('ref')||'';const EXTENSION_ID=/^[a-p]{32}$/.test(PARAMS.get('ext_id')||'')?(PARAMS.get('ext_id')||''):'';
let linkedEmail='';
let contextValid=false;
let currentLang='en';
let pollTimer=null;

function detectLang(){const qs=new URLSearchParams(location.search).get('lang');if(qs&&T[qs])return qs;const b=(navigator.language||'en').toLowerCase();if(b.startsWith('zh-tw')||b.startsWith('zh-hk'))return'zh-TW';if(b.startsWith('zh'))return'zh-CN';if(b.startsWith('pt'))return'pt';const hit=Object.keys(T).find(k=>b===k.toLowerCase()||b.startsWith(k.toLowerCase()+'-'));return hit||'en'}
function tr(key){return (T[currentLang]&&T[currentLang][key])||T.en[key]||key}
function renderLang(lang){currentLang=T[lang]?lang:'en';document.documentElement.lang=currentLang;document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});document.getElementById('language').value=currentLang;const u=new URL(location.href);u.searchParams.set('lang',currentLang);history.replaceState(null,'',u)}
function setButtons(enabled){document.querySelectorAll('button[data-plan]').forEach(btn=>btn.disabled=!(enabled&&paddleReady))}function showReturn(){const b=document.getElementById('returnButton');b.textContent=tr('returnNow');b.hidden=false}function returnToBestHistory(){debug('return-attempt',{extensionId:EXTENSION_ID||null});showReturn();if(!EXTENSION_ID||!window.chrome||!chrome.runtime||!chrome.runtime.sendMessage){status(tr('returnFailed'));return}status(tr('returning'),'ok');try{chrome.runtime.sendMessage(EXTENSION_ID,{type:'besthistory:payment-complete'},()=>{if(chrome.runtime.lastError){console.warn(chrome.runtime.lastError.message);status(tr('returnFailed'));showReturn()}})}catch(e){console.error(e);status(tr('returnFailed'));showReturn()}}
function status(text,kind=''){const el=document.getElementById('status');el.textContent=text;el.className=kind==='ok'?'status-ok':kind==='bad'?'status-bad':''}
function maskEmail(email){const [name,domain]=String(email).split('@');if(!domain)return email;const left=name.length<=2?name[0]+'*':name.slice(0,2)+'***';return left+'@'+domain}
async function loadPaddleConfig(){const res=await fetch(API_BASE+'/billing-public-config',{cache:'no-store'});const data=await res.json().catch(()=>null);if(!res.ok||!data?.clientToken||!data?.prices)throw new Error(data?.error||('HTTP_'+res.status));PADDLE_CONFIG=data;PLANS.monthly.priceId=data.prices.monthly||'';PLANS.annual.priceId=data.prices.annual||'';PLANS.lifetime.priceId=data.prices.lifetime||'';return data}
async function post(name,body){const res=await fetch(API_BASE+'/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error('HTTP_'+res.status);return res.json()}
async function verifyContext(){const box=document.getElementById('accountBox');if(!CHECKOUT_REF){box.innerHTML='<strong>'+tr('invalid')+'</strong>';setButtons(false);return}try{const data=await post('billing-get-checkout-context',{ref:CHECKOUT_REF});if(!data.valid){box.innerHTML='<strong>'+tr('invalid')+'</strong>';setButtons(false);return}linkedEmail=data.email||'';contextValid=Boolean(linkedEmail)&&!data.consumed;box.innerHTML='<strong>'+tr('linked')+'</strong><span>'+maskEmail(linkedEmail)+'</span>';setButtons(contextValid);if(data.consumed){status(tr('paid'),'ok');void pollActivation()}}catch(e){console.error(e);box.innerHTML='<strong>'+tr('invalid')+'</strong>';setButtons(false)}}
async function pollActivation(){clearTimeout(pollTimer);const started=Date.now();const tick=async()=>{try{const data=await post('billing-checkout-status',{ref:CHECKOUT_REF});if(data.activated){status(tr('activated'),'ok');showReturn();setTimeout(returnToBestHistory,650);return}}catch(e){console.error(e)}if(Date.now()-started>120000){status(tr('pending'));showReturn();return}pollTimer=setTimeout(tick,2000)};await tick()}
function openCheckout(planKey){if(!paddleReady||!contextValid||!linkedEmail)return;const plan=PLANS[planKey];if(!plan)return;status(tr('opening'));try{Paddle.Checkout.open({items:[{priceId:plan.priceId,quantity:1}],customer:{email:linkedEmail},customData:{app_code:'besthistory',checkout_ref:CHECKOUT_REF,billing_plan:plan.plan},settings:{displayMode:'overlay',variant:'one-page',theme:'light',allowLogout:false}})}catch(e){console.error(e);status(tr('failed'),'bad')}}
function onPaddleEvent(event){debug('paddle-event',{name:event?.name,transactionId:event?.data?.transaction_id||event?.data?.id||null});if(event&&event.name==='checkout.completed'){status(tr('paid'),'ok');setButtons(false);const transactionId=event?.data?.transaction_id||event?.data?.id||'';if(transactionId){void post('billing-report-checkout-completed',{ref:CHECKOUT_REF,transactionId}).catch(e=>console.warn(e)).finally(()=>void pollActivation())}else{void pollActivation()}}}

document.getElementById('language').addEventListener('change',e=>renderLang(e.target.value));document.getElementById('returnButton').addEventListener('click',returnToBestHistory);document.querySelectorAll('button[data-plan]').forEach(btn=>btn.addEventListener('click',()=>openCheckout(btn.dataset.plan)));
renderLang(detectLang());
async function initializeBilling(){try{const config=await loadPaddleConfig();if(config.environment==='sandbox')Paddle.Environment.set('sandbox');Paddle.Initialize({token:config.clientToken,eventCallback:onPaddleEvent});paddleReady=true;await verifyContext()}catch(e){console.error(e);status(tr('initFailed'),'bad');setButtons(false)}}
void initializeBilling();
</script>
